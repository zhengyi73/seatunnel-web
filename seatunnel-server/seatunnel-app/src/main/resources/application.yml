server:
  port: 8801

spring:
  application:
    name: seatunnel
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/seatunnel?useSSL=false&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 718731
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  ldap:
    url: ldap://localhost:389
    search:
      base: ou=people,dc=example,dc=com
      filter: (uid={0})
      domain: example.com
  authentication:
    providers:
      - DB
      #- LDAP # LDAP authentication is disabled by default
  async-config:
    core-pool-size: 10
    max-pool-size: 20
    queue-capacity: 100

jwt:
  expireTime: 86400
  # please add key when deploy
  secretKey: 3a7f9d2b5e8c1a4f6e9b2d5c8a7f3b6e9d2a5c8f7b4e1d2f5a8c9e7b3d6f9a2c5d8e7b1f4a7d2c5f8e9b6d3a7f4e1b2d5c8f9a7b4e2d5f8c9e6b3a7f4d1b2e5c8
  algorithm: HS256

seatunnel-web:
  datasource:
    encryption:
      type: none
      keys-to-encrypt:
        - password
        - auth
  access-controller-class: org.apache.seatunnel.app.permission.SeatunnelAccessControllerDefaultImpl

# SeaTunnel Engine REST API URL for proxying requests
seatunnel:
  engine:
    url: http://localhost:8080

# DolphinScheduler Integration
dolphinscheduler:
  url: http://192.168.1.117:12345/dolphinscheduler
  token: a2fe48479840e844a9292a133b900b3b
  tenant: default
  project-name: seatunnel
  callback-url: http://127.0.0.1:8801
---
spring:
  config:
    activate:
      on-profile: h2
  sql:
    init:
      schema-locations: classpath*:script/seatunnel_server_h2.sql
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:seatunnel;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=true
    username: sa
    password: sa
  h2:
    console:
      enabled: true
      path: /h2
      settings:
        trace: false
        web-allow-others: false
